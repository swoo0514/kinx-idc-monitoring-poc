---
# Zabbix 웹훅 미디어타입을 알림 게이트웨이로 배선한다.
#
# 왜 만들었나: Wazuh 쪽은 wazuh_gateway_integration.yml 이 토큰 배포부터 검증·되돌림까지
# 하는데, Zabbix 미디어타입만 화면에서 손으로 등록하고 있었다. "감시 정의를 코드로" 라고
# 말하면서 웹훅 배선 한 곳만 손에 남아 있던 셈이다. 실제로 손으로 넣다가 매크로 오타
# ({EVENT.NSEVERITY) → 괄호가 짝이 안 맞아 값이 null)로 게이트웨이가 422 를 던진 적이 있다.
#
# 무엇을 하나:
#   1) mediatype.get 으로 있는지 보고, 없으면 create / 있으면 update (멱등)
#   2) 스크립트 본문은 bot/gateway/zabbix_media_webhook.js 를 그대로 읽어 넣는다 (사본 금지)
#   3) 파라미터를 매크로로 박는다 — 손으로 칠 일이 없어지므로 오타가 구조적으로 사라진다
#
# 무엇을 안 하나: 액션(Action) 생성·수정. 액션은 호스트그룹·태그 조건이 환경마다 달라
# 여기서 만들면 기존 조건을 덮어쓸 위험이 크다. 액션에서 이 미디어타입을 고르는 것은 사람이 한다.
#
# 실행:
#   ansible-playbook zabbix_gateway_mediatype.yml -e @lab_vars.yml
# 필요한 변수: zabbix_api_url, zabbix_api_token, gateway_url, gateway_token
#
# ⚠ 토큰은 Zabbix 설정 DB 에 저장된다. 랩 한정으로 허용하고, 실환경은 Vault 류를 검토한다
#   (bot/GATEWAY_GUIDE.md 파라미터 표의 경고와 같은 내용).
- name: Wire Zabbix webhook media type to the bot gateway
  hosts: localhost
  gather_facts: false
  vars:
    mediatype_name: "KINX Gateway"
    script_path: "{{ playbook_dir }}/../bot/gateway/zabbix_media_webhook.js"
  tasks:
    - name: 필요한 변수가 들어왔는지 확인
      ansible.builtin.assert:
        that:
          - zabbix_api_url is defined and zabbix_api_url | length > 0
          - zabbix_api_token is defined and zabbix_api_token | length > 0
          - gateway_url is defined and gateway_url | length > 0
          - gateway_token is defined and gateway_token | length > 0
        fail_msg: >-
          zabbix_api_url · zabbix_api_token · gateway_url · gateway_token 이 필요하다
          (-e @lab_vars.yml). 토큰은 쓰기 권한이 있는 것이어야 한다 — 게이트웨이가 쓰는
          조회 전용 토큰으로는 mediatype.create 가 "No permissions" 로 막힌다.

    - name: 웹훅 스크립트 읽기 (사본을 두지 않는다 — 원본이 하나여야 어긋나지 않는다)
      ansible.builtin.set_fact:
        webhook_script: "{{ lookup('file', script_path) }}"

    - name: 기존 미디어타입 조회
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: mediatype.get
          params:
            output: ["mediatypeid", "name"]
            filter: { name: "{{ mediatype_name }}" }
          id: 1
      register: mt_get
      no_log: true

    - name: 조회 오류 확인
      ansible.builtin.fail:
        msg: "mediatype.get 실패 — {{ mt_get.json.error }}"
      when: mt_get.json.error is defined

    - name: 파라미터 구성 (매크로는 여기서만 적는다)
      ansible.builtin.set_fact:
        mt_parameters:
          - { name: "gateway_url", value: "{{ gateway_url }}" }
          - { name: "token", value: "{{ gateway_token }}" }
          - { name: "source", value: "zabbix-internal" }
          - { name: "event_id", value: "{EVENT.ID}" }
          - { name: "trigger_id", value: "{TRIGGER.ID}" }
          - { name: "event_value", value: "{EVENT.VALUE}" }
          - { name: "event_name", value: "{EVENT.NAME}" }
          - { name: "nseverity", value: "{EVENT.NSEVERITY}" }
          - { name: "host", value: "{HOST.HOST}" }
          - { name: "tags_json", value: "{EVENT.TAGSJSON}" }

    - name: 미디어타입 생성 (없을 때)
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: mediatype.create
          params:
            name: "{{ mediatype_name }}"
            type: 4                      # 4 = Webhook
            script: "{{ webhook_script }}"
            parameters: "{{ mt_parameters }}"
            status: 0                    # 0 = Enabled
            timeout: "10s"
            process_tags: "1"
          id: 2
      register: mt_create
      when: mt_get.json.result | length == 0
      no_log: true
      changed_when: mt_create.json.result is defined

    - name: 미디어타입 갱신 (있을 때 — 스크립트·파라미터를 항상 최신으로)
      ansible.builtin.uri:
        url: "{{ zabbix_api_url }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: mediatype.update
          params:
            mediatypeid: "{{ mt_get.json.result[0].mediatypeid }}"
            script: "{{ webhook_script }}"
            parameters: "{{ mt_parameters }}"
            timeout: "10s"
          id: 3
      register: mt_update
      when: mt_get.json.result | length > 0
      no_log: true
      changed_when: mt_update.json.result is defined

    - name: 결과 확인 (오류면 실패시킨다 — API 는 200 으로도 error 를 준다)
      ansible.builtin.fail:
        msg: >-
          미디어타입 배선 실패 —
          {{ (mt_create.json.error | default(mt_update.json.error, true)) }}
      when: >-
        (mt_create.json.error is defined) or (mt_update.json.error is defined)

    - name: 배선 결과
      ansible.builtin.debug:
        msg: >-
          '{{ mediatype_name }}' {{ '생성' if (mt_get.json.result | length == 0) else '갱신' }} 완료.
          액션에서 이 미디어타입을 고르는 것은 사람이 한다 — 액션 조건은 환경마다 다르므로
          이 플레이북이 건드리지 않는다.
