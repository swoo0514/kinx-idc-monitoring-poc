---
# 인증서 만료 감시 — certs.yml 목록을 읽어 도메인마다 Zabbix 호스트를 만들고 표준 템플릿을 링크.
# 근거·운영 기준은 ansible/DEPLOY_GUIDE.md "인증서 만료 감시".
# 사전 확인. 인벤토리에 [zabbix] 그룹이 없으면 ansible-playbook 은 "skipping: no hosts matched"
# 를 출력하고도 종료 코드 0 을 준다. 아래 플레이의 assert 도 함께 건너뛰므로 "아무것도 안 하고
# 성공"이 된다(2026-07-31 실측). remediate_service.yml 이 같은 이유로 사전 확인을 갖고 있다.
- name: 사전 확인 — Zabbix API 대상이 인벤토리에 있는가
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 인벤토리에 [zabbix] 그룹이 있는지 확인
      ansible.builtin.assert:
        that: "'zabbix' in groups and groups['zabbix'] | length > 0"
        fail_msg: >-
          인벤토리에 [zabbix] 그룹이 없어 아무 작업도 수행하지 않고 중단합니다.
          이 플레이북은 SSH 가 아니라 Zabbix API 를 대상으로 하며, 리포의 inventory.ini 에
          있는 [zabbix] 그룹(httpapi 연결)이 필요합니다. 로컬 인벤토리를 쓴다면 그 블록을
          복사하십시오. 현재 인벤토리의 그룹 - {{ groups.keys() | list | join(', ') }}
        success_msg: "[zabbix] 그룹 확인 - {{ groups['zabbix'] | join(', ') }}"

- name: Onboard TLS certificate monitoring (Zabbix objects)
  hosts: zabbix
  gather_facts: false
  vars_files:
    - certs.yml
  vars:
    ansible_zabbix_auth_key: "{{ lookup('env', 'ZABBIX_API_TOKEN') }}"
    cert_template: "Website certificate by Zabbix agent 2"
    cert_common_group: "Certificates"
    # 템플릿 마스터 아이템은 15m 수집 + "discard unchanged with heartbeat 6h" 라, 정상일 때도
    # 최대 6h15m 침묵한다. 창을 heartbeat 의 2배로 둔다 — 근거는 DEPLOY_GUIDE "점검 불가 트리거".
    cert_nodata_window: "12h"
    # 마스터(web.certificate.get)가 아니라 종속 아이템을 본다. 마스터는 history 가 꺼져 있어
    # nodata() 가 "item history is disabled" 로 평가되지 않는다 — DEPLOY_GUIDE 참조.
    cert_watch_key: "cert.not_after"
  tasks:
    - name: 감시 대상과 점검 에이전트 주소가 있는지 확인
      ansible.builtin.assert:
        that:
          - certificates | default([]) | length > 0
          - (cert_checker_ip | default('') | length > 0) or (cert_checker_dns | default('') | length > 0)
        fail_msg: >-
          certificates 목록과 점검 에이전트 주소가 필요하다 (-e @certs.local.yml).
          주소는 cert_checker_ip 를 권장한다 — Zabbix 서버가 컨테이너면 호스트의 /etc/hosts 를
          물려받지 않아 이름 해석에 실패한다(DEPLOY_GUIDE "점검 에이전트 주소는 IP 로").
        success_msg: >-
          점검 에이전트 {{ cert_checker_ip | default(cert_checker_dns) }}
          ({{ 'IP' if (cert_checker_ip | default('') | length > 0) else 'DNS' }})

    - name: 호스트그룹 생성 (목록의 그룹 + 공통 그룹)
      community.zabbix.zabbix_group:
        state: present
        host_groups: >-
          {{ (certificates | map(attribute='host_group') | list + [cert_common_group])
             | unique | list }}

    - name: 도메인별 감시 호스트 등록
      community.zabbix.zabbix_host:
        host_name: "cert-{{ item.domain }}"
        visible_name: "{{ item.domain }} 인증서"
        # 두 그룹에 넣는다. 권한 상속용(고객 그룹) + 전용 대시보드 필터용(공통 그룹).
        # 이유·부작용은 DEPLOY_GUIDE "cert 호스트를 두 그룹에 넣는 이유".
        host_groups: "{{ [item.host_group, cert_common_group] | unique | list }}"
        status: enabled
        state: present
        # cert_checker_ip 가 있으면 IP 로 붙는다. 이름 해석은 감시 대상 식별(FQDN 정규화)의
        # 문제이고, 여기는 접속 경로의 문제라 별개다 — DEPLOY_GUIDE "점검 에이전트 주소는 IP 로".
        interfaces:
          - type: 1
            main: 1
            useip: "{{ 1 if (cert_checker_ip | default('') | length > 0) else 0 }}"
            ip: "{{ cert_checker_ip | default('') }}"
            dns: "{{ cert_checker_dns | default('') }}"
            port: "10050"
        link_templates:
          - "{{ cert_template }}"
        macros:
          - macro: "{$CERT.WEBSITE.HOSTNAME}"
            value: "{{ item.domain }}"
          - macro: "{$CERT.WEBSITE.PORT}"
            value: "{{ item.port | default(443) }}"
          - macro: "{$CERT.EXPIRY.WARN}"
            value: "{{ item.expiry_warn | default(cert_expiry_warn_default) }}"
      loop: "{{ certificates }}"
      loop_control:
        label: "{{ item.domain }} → {{ item.host_group }} + {{ cert_common_group }}"

    # 만료 임박 트리거(템플릿 기본)와 짝을 이루는 두 번째 축.
    # "곧 죽는가"와 "보고 있기는 한가"는 다른 사건이다 — 근거·계기는 DEPLOY_GUIDE
    # "트리거가 둘인 이유". 핸드셰이크 실패 시 아이템이 unsupported 가 되어 값이 멈추므로
    # 만료 트리거만으로는 서비스 다운과 정상이 똑같이 조용하다.
    - name: 점검 불가 트리거 (수집이 멈춘 것을 만료 정상과 구분)
      community.zabbix.zabbix_trigger:
        state: present
        host_name: "cert-{{ item.domain }}"
        name: "인증서 점검 불가 — {{ item.domain }}"
        # desc 는 params 안이 아니라 최상위다(모듈 문서 확인).
        desc: >-
          {{ item.nodata_window | default(cert_nodata_window) }} 동안 인증서 정보가 수집되지
          않았다. 만료 여부를 알 수 없는 상태이므로 "이상 없음"으로 읽지 말 것.
          원인 후보 — 대상 서비스 다운(인증서 오류를 제외한 TLS 핸드셰이크 실패에서 아이템이
          unsupported 가 된다), 점검 에이전트 정지, DNS·방화벽, 프록시 경유(WebCertificate
          플러그인은 프록시를 지원하지 않는다).
          만료된 인증서는 여기가 아니라 "SSL certificate is invalid" 로 잡힌다 — 그 경우는
          데이터가 들어오기 때문이다.
        params:
          severity: average
          enabled: true
          expression: >-
            nodata(/cert-{{ item.domain }}/{{ cert_watch_key }},{{ item.nodata_window | default(cert_nodata_window) }})=1
      loop: "{{ certificates }}"
      loop_control:
        label: "{{ item.domain }} ({{ item.nodata_window | default(cert_nodata_window) }})"
