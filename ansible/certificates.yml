---
# 인증서 만료 감시 — certs.yml 목록을 읽어 도메인마다 Zabbix 호스트를 만들고 표준 템플릿을 링크.
# 근거·운영 기준은 ansible/DEPLOY_GUIDE.md "인증서 만료 감시".
- name: Onboard TLS certificate monitoring (Zabbix objects)
  hosts: zabbix
  gather_facts: false
  vars_files:
    - certs.yml
  vars:
    ansible_zabbix_auth_key: "{{ lookup('env', 'ZABBIX_API_TOKEN') }}"
    cert_template: "Website certificate by Zabbix agent 2"
    cert_common_group: "Certificates"
    # 템플릿 마스터 아이템은 15m 수집 + "discard unchanged with heartbeat 6h" 라, 정상일 때도
    # 최대 6h15m 침묵한다. 창을 heartbeat 의 2배로 둔다 — 근거는 DEPLOY_GUIDE "점검 불가 트리거".
    cert_nodata_window: "12h"
    cert_master_key: "web.certificate.get[{$CERT.WEBSITE.HOSTNAME},{$CERT.WEBSITE.PORT},{$CERT.WEBSITE.IP}]"
  tasks:
    - name: 감시 대상이 비어 있지 않은지 확인
      ansible.builtin.assert:
        that:
          - certificates | default([]) | length > 0
          - cert_checker_dns is defined and cert_checker_dns | length > 0
        fail_msg: "certificates 목록과 cert_checker_dns 가 필요하다 (-e @certs.local.yml)"

    - name: 호스트그룹 생성 (목록의 그룹 + 공통 그룹)
      community.zabbix.zabbix_group:
        state: present
        host_groups: >-
          {{ (certificates | map(attribute='host_group') | list + [cert_common_group])
             | unique | list }}

    - name: 도메인별 감시 호스트 등록
      community.zabbix.zabbix_host:
        host_name: "cert-{{ item.domain }}"
        visible_name: "{{ item.domain }} 인증서"
        # 두 그룹에 넣는다. 권한 상속용(고객 그룹) + 전용 대시보드 필터용(공통 그룹).
        # 이유·부작용은 DEPLOY_GUIDE "cert 호스트를 두 그룹에 넣는 이유".
        host_groups: "{{ [item.host_group, cert_common_group] | unique | list }}"
        status: enabled
        state: present
        interfaces:
          - type: 1
            main: 1
            useip: 0
            dns: "{{ cert_checker_dns }}"
            port: "10050"
        link_templates:
          - "{{ cert_template }}"
        macros:
          - macro: "{$CERT.WEBSITE.HOSTNAME}"
            value: "{{ item.domain }}"
          - macro: "{$CERT.WEBSITE.PORT}"
            value: "{{ item.port | default(443) }}"
          - macro: "{$CERT.EXPIRY.WARN}"
            value: "{{ item.expiry_warn | default(cert_expiry_warn_default) }}"
      loop: "{{ certificates }}"
      loop_control:
        label: "{{ item.domain }} → {{ item.host_group }} + {{ cert_common_group }}"

    # 만료 임박 트리거(템플릿 기본)와 짝을 이루는 두 번째 축.
    # "곧 죽는가"와 "보고 있기는 한가"는 다른 사건이다 — 근거·계기는 DEPLOY_GUIDE
    # "트리거가 둘인 이유". 핸드셰이크 실패 시 아이템이 unsupported 가 되어 값이 멈추므로
    # 만료 트리거만으로는 서비스 다운과 정상이 똑같이 조용하다.
    - name: 점검 불가 트리거 (수집이 멈춘 것을 만료 정상과 구분)
      community.zabbix.zabbix_trigger:
        state: present
        host_name: "cert-{{ item.domain }}"
        name: "인증서 점검 불가 — {{ item.domain }}"
        # desc 는 params 안이 아니라 최상위다(모듈 문서 확인).
        desc: >-
          {{ item.nodata_window | default(cert_nodata_window) }} 동안 인증서 정보가 수집되지
          않았다. 만료 여부를 알 수 없는 상태이므로 "이상 없음"으로 읽지 말 것.
          원인 후보 — 대상 서비스 다운(인증서 오류를 제외한 TLS 핸드셰이크 실패에서 아이템이
          unsupported 가 된다), 점검 에이전트 정지, DNS·방화벽, 프록시 경유(WebCertificate
          플러그인은 프록시를 지원하지 않는다).
          만료된 인증서는 여기가 아니라 "SSL certificate is invalid" 로 잡힌다 — 그 경우는
          데이터가 들어오기 때문이다.
        params:
          severity: average
          enabled: true
          expression: >-
            nodata(/cert-{{ item.domain }}/{{ cert_master_key }},{{ item.nodata_window | default(cert_nodata_window) }})=1
      loop: "{{ certificates }}"
      loop_control:
        label: "{{ item.domain }} ({{ item.nodata_window | default(cert_nodata_window) }})"
