---
# 게이트웨이 생존 감시 — Zabbix 측 수신 항목과 부재 감지 트리거.
# 봇 측 전송은 bot/gateway/heartbeat.py. 근거와 운영 기준은 ansible/DEPLOY_GUIDE.md.
#
# ⚠ 실환경에는 그대로 돌리지 않는다. 이 플레이북은 항목과 트리거를 **생성**하므로
#   실환경 읽기 전용 원칙에 어긋난다. 실환경은 같은 정의를 담당자가 반영한다.
- name: Gateway heartbeat receiver (Zabbix side)
  hosts: zabbix
  gather_facts: false
  vars:
    ansible_zabbix_auth_key: "{{ lookup('env', 'ZABBIX_API_TOKEN') }}"
    hb_host: "kinx-gateway"
    hb_group: "Applications"
    # 전송 주기(기본 60초)의 3배. 한 번 놓쳤다고 깨우면 재기동 때마다 알림이 뜬다.
    hb_nodata_window: "3m"
    # 알림이 이만큼 안 들어오면 발행 측(액션·미디어)이 멈췄는지 확인한다.
    # 사내는 하루 400건대라 30분 무알림은 드물다. 조용한 환경이면 늘린다.
    hb_quiet_window: "1800"
  tasks:
    - name: 게이트웨이 전용 호스트 (에이전트 없이 트래퍼만 받는다)
      community.zabbix.zabbix_host:
        host_name: "{{ hb_host }}"
        host_groups: ["{{ hb_group }}"]
        status: enabled
        state: present

    - name: 수신 항목 — 봇이 보내는 값 그대로
      community.zabbix.zabbix_item:
        host_name: "{{ hb_host }}"
        name: "{{ item.name }}"
        params:
          type: zabbix_trapper
          key: "{{ item.key }}"
          value_type: numeric_unsigned
          units: "{{ item.units | default('') }}"
          # 트래퍼는 서버가 값을 받을 때만 기록되므로 수집 주기가 없다.
          history: 31d
          trends: 365d
        state: present
      loop:
        - { name: "게이트웨이 생존", key: "gateway.alive" }
        - { name: "게이트웨이 구동 시간", key: "gateway.uptime", units: "s" }
        - { name: "마지막 알림 이후 경과", key: "gateway.since_last_alert", units: "s" }
        - { name: "수신 알림 수(누적)", key: "gateway.alerts" }
        - { name: "사건 수(누적)", key: "gateway.incidents" }
        - { name: "분석 수행 수(누적)", key: "gateway.analyzed" }
        - { name: "분석 생략 수(누적)", key: "gateway.skipped" }

    - name: 트리거 — 신호가 끊긴 것과 알림이 안 들어오는 것을 나눠 본다
      community.zabbix.zabbix_trigger:
        name: "{{ item.name }}"
        host_name: "{{ hb_host }}"
        # 설명문은 params 가 아니라 최상위 인자다(모듈이 API 의 comments 로 넣는다).
        description: "{{ item.description }}"
        params:
          expression: "{{ item.expression }}"
          severity: "{{ item.severity }}"
          # 봇이 이 트리거의 알림을 자기에게 보내면 죽었을 때 아무 데도 안 간다.
          # 이 호스트의 알림은 봇을 거치지 않는 경로로 보낸다(가이드 §20).
          manual_close: true
        state: present
      loop:
        - name: "게이트웨이 신호 끊김"
          expression: "nodata(/{{ hb_host }}/gateway.alive,{{ hb_nodata_window }})=1"
          severity: high
          description: >-
            봇이 {{ hb_nodata_window }} 동안 생존 신호를 보내지 않았다. 프로세스가
            죽었거나 Zabbix 로 가는 경로가 끊긴 것이다. 알림은 계속 들어오는데
            아무도 분석하지 않는 상태일 수 있다.
        - name: "알림이 들어오지 않음"
          expression: >-
            last(/{{ hb_host }}/gateway.alive)=1 and
            last(/{{ hb_host }}/gateway.since_last_alert)>{{ hb_quiet_window }}
          severity: average
          description: >-
            봇은 살아 있는데 알림이 오래 들어오지 않았다. 발행 측 액션이나 미디어가
            멈췄을 수 있다. 조용한 시간대가 정상인 환경이면 hb_quiet_window 를 늘린다.

# ── 알림 경로 — 게이트웨이를 거치지 않는 독립 경로 ──────────────────────────
# 게이트웨이가 죽었다는 알림을 게이트웨이로 보내면 그 알림도 같이 죽는다. 랩에서
# 실제로 그 상태였다(활성 액션이 게이트웨이 웹훅 하나뿐). Zabbix 서버가 Slack 으로
# 바로 보내는 경로를 따로 둔다. 채널도 분리한다 — 근거는 GATEWAY_GUIDE §20-5.
- name: Self-watch notification path (independent of the gateway)
  hosts: zabbix
  gather_facts: false
  vars:
    ansible_zabbix_auth_key: "{{ lookup('env', 'ZABBIX_API_TOKEN') }}"
    hb_host: "kinx-gateway"
    sw_media_name: "Selfwatch Slack"
    sw_user: "Admin"
    # 크리덴셜은 파일에 넣지 않는다. 실행 전에 export 한다.
    sw_bot_token: "{{ lookup('env', 'SELFWATCH_SLACK_BOT_TOKEN') }}"
    sw_channel: "{{ lookup('env', 'SELFWATCH_SLACK_CHANNEL') }}"
    sw_api: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ ansible_httpapi_port | default(8080) }}/api_jsonrpc.php"
    sw_action_name: "감시 도구 자체 알림 (게이트웨이 미경유)"
    # 발생·해소에 같은 동작을 쓴다. default_msg=1 이면 미디어 타입의 기본 문구를 쓴다.
    sw_op:
      operationtype: 0
      opmessage:
        default_msg: 1
        mediatypeid: "{{ sw_ids.results[1].json.result[0].mediatypeid }}"
      opmessage_usr:
        - userid: "{{ sw_ids.results[0].json.result[0].userid }}"
  tasks:
    - name: 크리덴셜 확인 — 비어 있으면 알림이 조용히 안 간다
      ansible.builtin.assert:
        that:
          - sw_bot_token | length > 0
          - sw_channel | length > 0
        fail_msg: >-
          SELFWATCH_SLACK_BOT_TOKEN 과 SELFWATCH_SLACK_CHANNEL 을 export 한 뒤 실행한다.
          봇이 쓰는 채널과 **다른 채널**을 지정한다.

    - name: 감시 도구 전용 미디어 타입 (Zabbix 서버가 Slack 으로 직접 발송)
      community.zabbix.zabbix_mediatype:
        name: "{{ sw_media_name }}"
        type: webhook
        status: enabled
        webhook_script: "{{ lookup('file', 'files/zabbix_media_selfwatch.js') }}"
        webhook_params:
          - name: bot_token
            value: "{{ sw_bot_token }}"
          - name: channel
            value: "{{ sw_channel }}"
          - name: event_name
            value: "{EVENT.NAME}"
          - name: event_value
            value: "{EVENT.VALUE}"
          - name: event_date
            value: "{EVENT.DATE}"
          - name: event_time
            value: "{EVENT.TIME}"
          - name: host
            value: "{HOST.HOST}"
          - name: severity
            value: "{EVENT.SEVERITY}"
        # 메시지 템플릿이 없으면 동작을 default_msg 로 둘 때 발송이 아예 만들어지지
        # 않는다. 랩에서 액션·조건·미디어가 다 맞는데도 알림이 안 가서 확인한 원인이다.
        # 문구 자체는 위 스크립트가 만들고, 여기서는 존재만 있으면 된다.
        message_templates:
          - eventsource: triggers
            recovery: operations
            subject: "{EVENT.NAME}"
            body: "{EVENT.NAME}"
          - eventsource: triggers
            recovery: recovery_operations
            subject: "{EVENT.NAME}"
            body: "{EVENT.NAME}"
        state: present

    # zabbix_user 모듈은 사용자를 통째로 관리하려 해서 소속 그룹까지 요구한다. 기존
    # 사용자의 그룹을 우리가 다시 써 넣으면 틀렸을 때 로그인이 막힌다. 그래서 미디어만
    # 바꾼다 — user.update 는 넘긴 항목만 바꾸고 나머지는 그대로 둔다(공식 문서 확인).
    - name: 사용자·미디어 타입 식별자 조회
      ansible.builtin.uri:
        url: "{{ sw_api }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ lookup('env', 'ZABBIX_API_TOKEN') }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: "{{ item.method }}"
          params: "{{ item.params }}"
      register: sw_ids
      loop:
        - method: user.get
          params: { output: ["userid"], filter: { username: "{{ sw_user }}" } }
        - method: mediatype.get
          params: { output: ["mediatypeid"], filter: { name: "{{ sw_media_name }}" } }
      loop_control:
        label: "{{ item.method }}"

    - name: 조회 결과 확인 — 없으면 알림이 조용히 안 간다
      ansible.builtin.assert:
        that:
          - sw_ids.results[0].json.result | length > 0
          - sw_ids.results[1].json.result | length > 0
        fail_msg: "사용자 {{ sw_user }} 또는 미디어 타입 {{ sw_media_name }} 을 찾지 못했다"

    - name: 수신 사용자에게 이 미디어 연결 (미디어만 교체)
      ansible.builtin.uri:
        url: "{{ sw_api }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ lookup('env', 'ZABBIX_API_TOKEN') }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: user.update
          params:
            userid: "{{ sw_ids.results[0].json.result[0].userid }}"
            medias:
              - mediatypeid: "{{ sw_ids.results[1].json.result[0].mediatypeid }}"
                sendto: "{{ sw_channel }}"
                active: 0          # 0 = 사용, 1 = 사용 안 함
                severity: 60       # Warning(4)+Average(8)+High(16)+Disaster(32)
                period: "1-7,00:00-24:00"
      register: sw_upd
      failed_when: sw_upd.json.error is defined
      changed_when: true

    # 액션도 API 를 직접 부른다. 모듈로 만들었을 때 changed 를 돌려주고도 실제로는
    # 생성되지 않았다. 호스트 조건의 값은 호스트 **이름이 아니라 식별자**여야 한다
    # (공식 문서 확인). 조용히 안 만들어지는 것이 이 작업에서 제일 나쁜 결과라
    # 만든 뒤에 다시 조회해서 확인한다.
    - name: 대상 호스트 식별자 조회
      ansible.builtin.uri:
        url: "{{ sw_api }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ lookup('env', 'ZABBIX_API_TOKEN') }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: host.get
          params:
            output: ["hostid"]
            filter: { host: "{{ hb_host }}" }
      register: sw_hostid

    - name: 기존 액션 조회 (있으면 갱신, 없으면 생성)
      ansible.builtin.uri:
        url: "{{ sw_api }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ lookup('env', 'ZABBIX_API_TOKEN') }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: action.get
          params:
            output: ["actionid"]
            filter: { name: "{{ sw_action_name }}" }
      register: sw_action_cur

    - name: 액션 — 이 호스트의 알림만, 이 미디어로만
      ansible.builtin.uri:
        url: "{{ sw_api }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ lookup('env', 'ZABBIX_API_TOKEN') }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: "{{ 'action.update' if sw_action_cur.json.result | length > 0 else 'action.create' }}"
          params: >-
            {{
              ({'actionid': sw_action_cur.json.result[0].actionid}
               if sw_action_cur.json.result | length > 0 else
               {'name': sw_action_name, 'eventsource': 0})
              | combine({
                  'status': 0,
                  'esc_period': '1h',
                  'filter': {
                    'evaltype': 0,
                    'conditions': [
                      {'conditiontype': 1, 'operator': 0,
                       'value': sw_hostid.json.result[0].hostid}
                    ]
                  },
                  'operations': [ sw_op ],
                  'recovery_operations': [ sw_op ]
                })
            }}
      register: sw_action_res
      failed_when: sw_action_res.json.error is defined
      changed_when: true

    - name: 액션이 실제로 만들어졌는지 다시 확인
      ansible.builtin.uri:
        url: "{{ sw_api }}"
        method: POST
        headers:
          Content-Type: application/json-rpc
          Authorization: "Bearer {{ lookup('env', 'ZABBIX_API_TOKEN') }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: action.get
          params:
            output: ["actionid", "name", "status"]
            filter: { name: "{{ sw_action_name }}" }
      register: sw_verify
      failed_when: >-
        sw_verify.json.result | length == 0
        or sw_verify.json.result[0].status != "0"

    - name: 결과
      ansible.builtin.debug:
        msg: "액션 {{ sw_verify.json.result[0].actionid }} 활성 — {{ sw_action_name }}"
