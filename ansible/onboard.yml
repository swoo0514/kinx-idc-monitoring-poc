---
# MSP 고객 온보딩 — customers.yml 목록을 읽어 Zabbix 감시 정의(호스트그룹·호스트)를 자동 등록.
# 고객 추가 = customers.yml 에 항목 추가 후 재실행(멱등). 토큰은 env ZABBIX_API_TOKEN.
- name: Onboard MSP customers (Zabbix objects)
  hosts: zabbix
  gather_facts: false
  vars_files:
    - customers.yml
  vars:
    ansible_zabbix_auth_key: "{{ lookup('env', 'ZABBIX_API_TOKEN') }}"
  tasks:
    - name: 고객 호스트그룹 생성 (전 고객 일괄)
      community.zabbix.zabbix_group:
        state: present
        host_groups: "{{ customers | map(attribute='host_group') | list }}"

    - name: 고객 호스트 등록 (고객×호스트 반복)
      community.zabbix.zabbix_host:
        host_name: "{{ item.1.name }}"
        host_groups:
          - "{{ item.0.host_group }}"
        status: enabled
        state: present
        interfaces:
          - type: 1
            main: 1
            useip: 0
            dns: "{{ item.1.interface_dns }}"
            port: "10050"
        link_templates: "{{ item.1.templates }}"
      loop: "{{ customers | subelements('hosts') }}"
      loop_control:
        label: "{{ item.0.host_group }} / {{ item.1.name }}"

    - name: 고객별 조회 user group 생성 (자기 그룹만 read = 격리)
      community.zabbix.zabbix_usergroup:
        name: "{{ item.host_group | regex_replace('^.*/', '') }}-view"
        hostgroup_rights:
          - host_group: "{{ item.host_group }}"
            permission: read-only
        state: present
      loop: "{{ customers }}"
      loop_control:
        label: "{{ item.host_group }}"

    - name: 고객별 조회 계정 생성 (자기 그룹만 보는 격리 계정)
      community.zabbix.zabbix_user:
        username: "{{ item.view_user }}"
        passwd: "{{ lookup('env', 'ZBX_CUST_PASSWORD') }}"
        usrgrps:
          - "{{ item.host_group | regex_replace('^.*/', '') }}-view"
        role_name: "User role"
        state: present
      loop: "{{ customers }}"
      loop_control:
        label: "{{ item.view_user }}"
