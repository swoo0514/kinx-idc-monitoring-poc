# Ansible이 다룰 "대상" = Zabbix API (서버 SSH 아님). httpapi 연결로 API 호출.
[zabbix]
zabbix_lab ansible_host=127.0.0.1

# 3종 에이전트 배포 대상 = 실제 호스트(SSH). deploy_agents.yml 이 사용.
# agent_identity = 세 시스템 공통 식별자(FQDN). 이 값으로 정규화되어 매핑 불필요.
[targets]
# 예: db-target-001 ansible_host=192.0.2.XX agent_identity=db-target-001.novalocal

[targets:vars]
ansible_user=rocky
# ansible_ssh_private_key_file=~/.ssh/... (필요 시)

[zabbix:vars]
ansible_connection=httpapi
ansible_network_os=community.zabbix.zabbix
ansible_httpapi_port=8080
ansible_httpapi_use_ssl=false
ansible_httpapi_validate_certs=false
ansible_zabbix_url_path=''
