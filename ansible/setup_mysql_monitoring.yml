---
# DB 타깃의 복제 지연 감시 배선 (agent 측). 설계·근거는 ansible/DEPLOY_GUIDE.md.
- name: MySQL monitoring (agent side) — 모니터링 계정 + agent2 세션
  hosts: targets
  become: true
  vars:
    mysql_session_name: repl
    mysql_monitor_user: zbx_monitor
    # mysql_monitor_password 는 gitignored lab_vars.yml 에서 주입
  tasks:
    - name: zbx_monitor 계정 + 권한 (공식 템플릿 요구 권한, 멱등)
      ansible.builtin.command:
        cmd: >
          mariadb -e "CREATE USER IF NOT EXISTS '{{ mysql_monitor_user }}'@'%' IDENTIFIED BY '{{ mysql_monitor_password }}';
          ALTER USER '{{ mysql_monitor_user }}'@'%' IDENTIFIED BY '{{ mysql_monitor_password }}';
          GRANT REPLICATION CLIENT, SLAVE MONITOR, PROCESS, SHOW DATABASES, SHOW VIEW ON *.* TO '{{ mysql_monitor_user }}'@'%';
          FLUSH PRIVILEGES;"
      no_log: true

    - name: agent2 MySQL 플러그인 세션 (자격증명은 에이전트 설정에만, Zabbix DB 아님)
      ansible.builtin.template:
        src: mysql_session.conf.j2
        dest: /etc/zabbix/zabbix_agent2.d/mysql.conf
        owner: root
        mode: "0640"
      no_log: true
      notify: restart zabbix-agent2

  handlers:
    - name: restart zabbix-agent2
      ansible.builtin.systemd: { name: zabbix-agent2, state: restarted }
