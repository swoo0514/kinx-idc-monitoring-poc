# LiteLLM 프록시 — Anthropic 뒤에 Presidio 마스킹 가드레일. HolmesGPT는 openai/masked-opus 로 호출.
# output_parse_pii: 응답에서 마스킹 토큰을 원본으로 역치환(에이전틱 tool-call 루프 견디는지가 검증점).
# 기본 엔티티(IP·PERSON)로 파이프라인 먼저 증명 → KINX 커스텀(사설IP대역·고객사명·DB명)은 Presidio
# recognizer로 추가(task #5). 근거: docs.litellm.ai/docs/proxy/guardrails/pii_masking_v2.
litellm_settings:
  # HolmesGPT가 보내는 temperature≈0 등 claude-opus-4-8 미지원 파라미터를 드롭
  # (OpenAI호환→LiteLLM→Anthropic 경로에서 생기는 파라미터 호환 이슈).
  drop_params: true

model_list:
  - model_name: masked-claude          # 모델 중립 이름 — 아래 model만 갈면 스왑 (HolmesGPT는 이 이름 호출)
    litellm_params:
      model: anthropic/claude-sonnet-4-6   # opus 대비 저렴. 필요시 claude-sonnet-5/claude-opus-4-8로 스왑
      api_key: os.environ/ANTHROPIC_API_KEY

guardrails:
  - guardrail_name: "presidio-mask"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      output_parse_pii: true
      presidio_filter_scope: both
      # KINX 커스텀 인식기(호스트명·DB명·고객사명). PERSON/LOCATION은 기술텍스트 오탐이 심해 제외.
      presidio_ad_hoc_recognizers: "/app/kinx_recognizers.json"
      pii_entities_config:
        IP_ADDRESS: "MASK"
        KINX_HOST: "MASK"
        KINX_DB: "MASK"
        KINX_CUSTOMER: "MASK"
