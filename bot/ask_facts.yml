# 관측 지식 조각 — 질의 창구가 헤매지 않도록 우리 환경의 사실을 적어 둔다.
#
# 근거: LY SRELens 가 "DataSource Fragment" 로 가장 큰 효과를 봤다고 밝힌 것과 같은
# 성격이다. 어떤 축이 무슨 이름을 쓰고 어떤 키가 무엇을 뜻하는지를 모델이 모르면
# match 를 헤매며 라운드를 태운다.
#
# **여기에 실명·주소·크리덴셜을 적지 않는다.** 이 파일 내용은 프롬프트로 나간다.
# 호스트 이름은 대상 표가 토큰으로 넘기므로 여기에 적을 이유가 없다.

axes: |
  - 지표(metrics)는 Zabbix 에서 온다. host_metrics 로 본다.
  - 로그(logs)는 Loki 에서 온다. host_logs 로 본다. 라벨은 host 하나만 쓴다.
  - 보안(security)은 Wazuh 에서 온다. security_alerts 로 본다.
  - 같은 기계를 세 축이 다른 이름으로 부르는 환경이라 서버가 이름을 맞춰 둔다.
    도구에는 토큰만 넣으면 되고 축별 이름은 신경 쓰지 않아도 된다.

item_keys: |
  자주 쓰는 Zabbix 아이템과 match 에 넣을 말:
  - 복제 지연: "replication" (Seconds Behind Master, Slave IO/SQL Running)
  - CPU: "cpu" (idle·iowait·system·user 로 나뉜다. idle 이 떨어지고 iowait 이 오르면
    계산이 아니라 디스크 대기다)
  - 메모리: "memory" (available·utilization)
  - 디스크: "vfs.fs" (used·pused)
  - 프로세스: "proc.num"
  - 인증서 만료: "cert" (남은 일수)

severity: |
  통합 심각도는 SEV1~SEV4 이다. 숫자가 작을수록 급하다.
  Wazuh 규칙 레벨은 0~15 로 눈금이 다르다. 10 이상이 팀의 알림 기준이다.
  파일 무결성(syscheck)과 설정 준수(sca)는 레벨 5~9 라 그 자체로는 침해 신호가 아니다.

habits: |
  - 사람이 화면을 보고 물으면 대개 튄 자리를 묻는 것이다. 지표를 먼저 보고,
    튄 구간이 있으면 그 구간의 로그를 좁혀 보라.
  - 복제가 늦은 것과 복제가 깨진 것은 다르다. 늦은 것은 원인을 없애면 따라잡는다.
  - 백업·대량 삭제·인덱스 재생성은 자원 압박과 복제 지연을 함께 만든다.
