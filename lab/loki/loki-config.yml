# Loki 단일 바이너리 설정 (랩용).
# 기준: 공식 loki-local-config.yaml (v3.4.0)
#   https://raw.githubusercontent.com/grafana/loki/v3.4.0/cmd/loki/loki-local-config.yaml
# 랩 조정 2곳만 공식과 다름: (1) path_prefix 를 /loki 로(도커 볼륨 영속),
#   (2) reject_old_samples: false(과거 시각 로그 주입 허용 — 장애 재현 시 유용). 근거는 BUILD_GUIDE.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  allow_structured_metadata: true

ruler:
  alertmanager_url: http://localhost:9093
