# Loki 단일 바이너리 설정 (랩용).
# 기준: 공식 loki-local-config.yaml (v3.4.0)
#   https://raw.githubusercontent.com/grafana/loki/v3.4.0/cmd/loki/loki-local-config.yaml
# 랩 조정 2곳만 공식과 다름: (1) path_prefix 를 /loki 로(도커 볼륨 영속),
#   (2) reject_old_samples: false(과거 시각 로그 주입 허용 — 장애 재현 시 유용). 근거는 BUILD_GUIDE.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 보존 정책. compactor.retention_enabled 를 켜지 않으면 Loki 로 보낸 로그는 지워지지
# 않고 계속 쌓인다(공식 문서). delete_request_store 는 보존을 켤 때 필수이며, 우리
# object_store 가 filesystem 이므로 같은 값을 쓴다.
compactor:
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  reject_old_samples: false
  allow_structured_metadata: true
  # 31일. MSP 월간 리포트가 한 달치 로그 근거 커버리지를 세므로 그보다 짧으면 리포트가
  # 자기 기간을 못 본다. 하루는 경계에서 잘리지 않도록 둔 여유다.
  # 랩 실측(2026-08-10): 유입 약 46 B/s = 하루 4MB, 스트림 12개. 31일치가 약 124MB 라
  # 디스크에는 부담이 없다. 실환경은 호스트 수가 달라 도입 전 재산정이 필요하다.
  retention_period: 744h

ruler:
  alertmanager_url: http://localhost:9093
