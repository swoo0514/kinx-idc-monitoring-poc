# KINX IDC 모니터링 랩 — docker 몸통 (Week 1)
# 설정 근거·단계·트러블슈팅은 BUILD_GUIDE.md 참조 (주석 대신 문서로 관리).
# 크리덴셜은 .env 에서 읽는다(.env 커밋 금지). 이미지 태그는 실환경 정합 7.0.27 고정.

name: kinx-lab

services:
  mariadb:
    image: mariadb:10.11
    container_name: kinx-mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log_bin_trust_function_creators=1
      - --server-id=1
      - --log-bin
      - --log-basename=mariadb-master
      - --binlog-format=mixed
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - lab_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0.27
    container_name: kinx-zabbix-server
    environment:
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 최초 스키마 생성에 root 필요(공식)
    ports:
      - "10051:10051"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - lab_net
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0.27
    container_name: kinx-zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PHP_TZ: Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - lab_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.16
    container_name: kinx-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app,grafana-opensearch-datasource
      ZBX_GRAFANA_USER: ${ZBX_GRAFANA_USER:-}
      ZBX_GRAFANA_PASSWORD: ${ZBX_GRAFANA_PASSWORD:-}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - zabbix-web
      - loki
    networks:
      - lab_net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.0
    container_name: kinx-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - lab_net
    restart: unless-stopped

  mariadb-slave:
    image: mariadb:10.11
    container_name: kinx-mariadb-slave
    profiles: ["ha"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log_bin_trust_function_creators=1
      - --server-id=2
      - --log-basename=mariadb-slave
      - --read-only=1
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_slave_data:/var/lib/mysql
    networks:
      - lab_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # slave 복제 지연을 표준 MySQL 템플릿으로 감시하기 위한 agent2 (메트릭 깊이 데모).
  # 접속 정보(계정/DSN)는 conf 에 넣지 않고 Zabbix 호스트 매크로로 주입 → 크리덴셜 커밋 없음.
  # 등록·템플릿 링크·매크로 절차는 BUILD_GUIDE §10.
  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0.27
    container_name: kinx-zabbix-agent2
    profiles: ["ha"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: lab-db-agent
    depends_on:
      - zabbix-server
    networks:
      - lab_net
    restart: unless-stopped

  # 알림 다이어트 데모용 가짜 SNMP 스위치 (numeric 모듈로 ifInErrors 카운터 증가).
  # community 이름 = data 파일명(switch1 → switch1.snmprec). 설정 근거·검증은 BUILD_GUIDE.
  snmpsim:
    image: thola/snmpsim
    container_name: kinx-snmpsim
    profiles: ["chaos"]
    command: snmpsim-command-responder --data-dir=/data --agent-udpv4-endpoint=0.0.0.0:1161
    volumes:
      - ./snmpsim/data:/data:ro
    ports:
      - "1161:1161/udp"
    networks:
      - lab_net
    restart: unless-stopped

volumes:
  mariadb_data:
  mariadb_slave_data:
  grafana_data:
  loki_data:

networks:
  lab_net:
    driver: bridge
