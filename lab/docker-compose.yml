# KINX IDC 모니터링 랩 — docker 몸통 (Week 1)
# 설정 근거·단계·트러블슈팅은 BUILD_GUIDE.md 참조 (주석 대신 문서로 관리).
# 크리덴셜은 .env 에서 읽는다(.env 커밋 금지). 이미지 태그는 실환경 정합 7.0.27 고정.

name: kinx-lab

services:
  mariadb:
    image: mariadb:10.11
    container_name: kinx-mariadb
    command:
      # Zabbix 7.0 공식 compose_databases.yaml 기준 3종. (복제용 log-bin/server-id는 ha 단계에서)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log_bin_trust_function_creators=1
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - lab_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0.27
    container_name: kinx-zabbix-server
    environment:
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 최초 스키마 생성에 root 필요(공식)
    ports:
      - "10051:10051"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - lab_net
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0.27
    container_name: kinx-zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PHP_TZ: Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - lab_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: kinx-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - zabbix-web
      - loki
    networks:
      - lab_net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.0
    container_name: kinx-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - lab_net
    restart: unless-stopped

# 다음 단계에서 profiles 로 붙일 자리 (BUILD_GUIDE §다음 단계):
#   [ha] mariadb-slave(server-id=2)+zabbix-server2  [chaos] 에이전트 노드+snmpsim
#   [auto] n8n   [ai] ollama

volumes:
  mariadb_data:
  grafana_data:
  loki_data:

networks:
  lab_net:
    driver: bridge
