# KINX IDC 모니터링 랩 — docker 몸통 (Week 1)
# 설정 근거·단계·트러블슈팅은 BUILD_GUIDE.md 참조 (주석 대신 문서로 관리).
# 크리덴셜은 .env 에서 읽는다(.env 커밋 금지). 이미지 태그는 실환경 정합 7.0.27 고정.

name: kinx-lab

services:
  mariadb:
    image: mariadb:10.11
    container_name: kinx-mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log_bin_trust_function_creators=1
      - --server-id=1
      - --log-bin
      - --log-basename=mariadb-master
      - --binlog-format=mixed
      # binlog 만료. 없으면 무한히 쌓여 디스크가 찬다 — 복제가 멈추면 마스터는 binlog 를
      # 지울 수도 없다. 근거는 docs/03-pitfalls/build-traps.md.
      - --expire-logs-days=3
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    # 복제용(데모 C vm-target-002). 기본 localhost=비노출. .env MASTER_BIND_IP=사설IP 로만 노출(공인 금지)
    ports:
      - "${MASTER_BIND_IP:-127.0.0.1}:3306:3306"
    networks:
      - lab_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0.27
    container_name: kinx-zabbix-server
    labels:
      kinx.host: "Zabbix server"
    environment:
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 최초 스키마 생성에 root 필요(공식)
      # 예약 리포트(MSP 월간 리포트). /report 경로는 필수이고 기본 포트는 10053.
      # StartReportWriters 가 0 이면 리포트 생성이 비활성이다(범위 1~100).
      ZBX_WEBSERVICEURL: http://zabbix-web-service:10053/report
      ZBX_STARTREPORTWRITERS: 3
    ports:
      - "10051:10051"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - lab_net
    restart: unless-stopped

  # 예약 리포트 렌더러. 대시보드를 헤드리스 Chrome 으로 그려 PDF 로 만든다(공식 이미지에
  # Chrome 포함). ZBX_ALLOWEDIP 기본값이 "zabbix-server" 라 우리 컨테이너명과 일치해 생략.
  # 근거·설정은 ansible/DEPLOY_GUIDE.md "MSP 월간 리포트".
  zabbix-web-service:
    image: zabbix/zabbix-web-service:alpine-7.0.27
    container_name: kinx-zabbix-web-service
    environment:
      ZBX_ALLOWEDIP: zabbix-server
    depends_on:
      - zabbix-server
    networks:
      - lab_net
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0.27
    container_name: kinx-zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PHP_TZ: Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - lab_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.16
    container_name: kinx-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app,grafana-opensearch-datasource
      ZBX_GRAFANA_USER: ${ZBX_GRAFANA_USER:-}
      ZBX_GRAFANA_PASSWORD: ${ZBX_GRAFANA_PASSWORD:-}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      # MSP 월간 리포트 PDF. Grafana OSS 에는 예약 리포트가 없으므로(Enterprise 기능)
      # 렌더러만 붙이고 생성·발송은 우리 스크립트가 한다. 근거는 DEPLOY_GUIDE "MSP 월간 리포트".
      GF_RENDERING_SERVER_URL: http://grafana-image-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # 대화형 질의 앱. 사설 서명 전까지는 미서명 로드를 허용한다(공식 문서는 운영
      # 사용을 권고하지 않으므로 서명 후 이 줄을 뺀다). 근거는 계획서 5단계.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: kinxidc-ask-app,kinxidc-ask-datasource
      # 프로비저닝의 secureJsonData 가 이 값을 가져간다. 파일에 토큰을 안 적기 위해서다.
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      # **하위 경로만 건다.** plugins 를 통째로 마운트하면 GF_INSTALL_PLUGINS 로 깔린
      # Zabbix·OpenSearch 플러그인이 가려진다.
      # 앱은 빌드 산출물을 얹는다(grafana-app/ 에서 npm run build).
      - ../grafana-app/dist:/var/lib/grafana/plugins/kinxidc-ask-app:ro
      - ./grafana/plugins/kinxidc-ask-datasource:/var/lib/grafana/plugins/kinxidc-ask-datasource:ro
    # 게이트웨이는 컨테이너가 아니라 호스트의 8800 에서 돈다(systemd kinx-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zabbix-web
      - loki
    networks:
      - lab_net
    restart: unless-stopped

  # 대시보드를 헤드리스 Chromium 으로 그려 이미지로 낸다. OSS 에서도 쓸 수 있다
  # (공식: "Image rendering works with Grafana OSS, Grafana Enterprise, and Grafana Cloud").
  # 예약·발송은 여기 없다 — 그건 Grafana Enterprise 기능이라 우리 스크립트가 대신한다.
  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: kinx-grafana-renderer
    environment:
      ENABLE_METRICS: "false"
    networks:
      - lab_net
    restart: unless-stopped

  # 랩 수신함. 실제 메일서버 없이 발송 파이프를 끝까지 돌려보고 **받은 메일을 눈으로**
  # 확인하기 위한 것이다(SMTP 1025 / 웹 8025). 실환경에서는 SMTP_HOST 를 사내 메일서버로
  # 바꾸기만 하면 되고, 스크립트는 그대로다.
  mailpit:
    image: axllent/mailpit:latest
    container_name: kinx-mailpit
    environment:
      MP_MAX_MESSAGES: 200
    ports:
      - "8025:8025"
      # SMTP 는 **루프백에만** 연다. 0.0.0.0 으로 열면 인증 없는 오픈 릴레이가 된다.
      - "127.0.0.1:1025:1025"
    networks:
      - lab_net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.0
    container_name: kinx-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - lab_net
    restart: unless-stopped

  # 컨테이너 로그 → Loki. kinx.host 라벨을 단 컨테이너만 걷고, 그 값이 Loki host 라벨이
  # 된다(= Zabbix 호스트명). 도커 소켓은 읽기 전용으로만 준다. 근거는 lab/README.md.
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: kinx-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - lab_net
    restart: unless-stopped

  mariadb-slave:
    image: mariadb:10.11
    container_name: kinx-mariadb-slave
    labels:
      kinx.host: "lab-db-agent"
    profiles: ["ha"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log_bin_trust_function_creators=1
      - --server-id=2
      - --log-basename=mariadb-slave
      - --read-only=1
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_slave_data:/var/lib/mysql
    networks:
      - lab_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # slave 복제 지연을 표준 MySQL 템플릿으로 감시하기 위한 agent2 (메트릭 깊이 데모).
  # 접속 정보(계정/DSN)는 conf 에 넣지 않고 Zabbix 호스트 매크로로 주입 → 크리덴셜 커밋 없음.
  # 등록·템플릿 링크·매크로 절차는 BUILD_GUIDE §10.
  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0.27
    container_name: kinx-zabbix-agent2
    labels:
      kinx.host: "lab-db-agent"
    profiles: ["ha"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: lab-db-agent
    depends_on:
      - zabbix-server
    networks:
      - lab_net
    restart: unless-stopped

  # 알림 다이어트 데모용 가짜 SNMP 스위치 (numeric 모듈로 ifInErrors 카운터 증가).
  # community 이름 = data 파일명(switch1 → switch1.snmprec). 설정 근거·검증은 BUILD_GUIDE.
  snmpsim:
    image: thola/snmpsim
    container_name: kinx-snmpsim
    labels:
      kinx.host: "lab-switch1"
    profiles: ["chaos"]
    # 이미지 ENTRYPOINT 가 이미 responder 이므로 옵션만 전달(프로그램명 넣으면 인자로 오인).
    command: ["--data-dir=/data", "--agent-udpv4-endpoint=0.0.0.0:1161"]
    volumes:
      - ./snmpsim/data:/data:ro
    ports:
      - "1161:1161/udp"
    networks:
      - lab_net
    restart: unless-stopped

  # ── MSP 고객 A 스택 (profile: msp) — 웹 + DB(master-slave 복제) + 감시 에이전트 ──
  # 온보딩·복제 셋업·감시 등록 절차는 BUILD_GUIDE §11.
  customer-a-db-master:
    image: mariadb:10.11
    container_name: kinx-cust-a-db-master
    labels:
      kinx.host: "customer-a"
    profiles: ["msp"]
    command:
      - --server-id=3
      - --log-bin
      - --log-basename=cust-a-master
      - --binlog-format=mixed
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - cust_a_master_data:/var/lib/mysql
    networks:
      - lab_net
    restart: unless-stopped

  customer-a-db-slave:
    image: mariadb:10.11
    container_name: kinx-cust-a-db-slave
    labels:
      kinx.host: "customer-a"
    profiles: ["msp"]
    command:
      - --server-id=4
      - --log-basename=cust-a-slave
      - --read-only=1
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - cust_a_slave_data:/var/lib/mysql
    networks:
      - lab_net
    restart: unless-stopped

  customer-a-web:
    image: nginx:alpine
    container_name: kinx-cust-a-web
    labels:
      kinx.host: "customer-a"
    profiles: ["msp"]
    networks:
      - lab_net
    restart: unless-stopped

  customer-a-agent:
    image: zabbix/zabbix-agent2:alpine-7.0.27
    container_name: kinx-cust-a-agent
    labels:
      kinx.host: "customer-a"
    profiles: ["msp"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: customer-a
    networks:
      - lab_net
    restart: unless-stopped

  # ── MSP 고객 B 스택 (profile: msp) — OS 유형 고객: 감시 에이전트만(Linux 템플릿) ──
  # A=DB 고객 / B=OS 고객 = 이질적 두 테넌트(유형별 대시보드 전략). 감시 등록은 ansible/onboard.yml.
  customer-b-agent:
    image: zabbix/zabbix-agent2:alpine-7.0.27
    container_name: kinx-cust-b-agent
    labels:
      kinx.host: "customer-b"
    profiles: ["msp"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: customer-b
    networks:
      - lab_net
    restart: unless-stopped

  # ── MSP 고객 C (profile: msp) — OS 고객, customers.yml 온보딩 시연용 ──
  customer-c-agent:
    image: zabbix/zabbix-agent2:alpine-7.0.27
    container_name: kinx-cust-c-agent
    labels:
      kinx.host: "customer-c"
    profiles: ["msp"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: customer-c
    networks:
      - lab_net
    restart: unless-stopped

volumes:
  mariadb_data:
  mariadb_slave_data:
  grafana_data:
  loki_data:
  cust_a_master_data:
  cust_a_slave_data:

networks:
  lab_net:
    driver: bridge
