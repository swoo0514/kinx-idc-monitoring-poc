apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false

  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    jsonData:
      username: $ZBX_GRAFANA_USER
      trends: true
      trendsFrom: "7d"
      cacheTTL: "1h"
    secureJsonData:
      password: $ZBX_GRAFANA_PASSWORD

  - name: Wazuh
    uid: wazuh
    type: grafana-opensearch-datasource
    access: proxy
    url: $WAZUH_INDEXER_URL
    jsonData:
      # Wazuh indexer는 Elasticsearch 7.10.2로 보고 → flavor=elasticsearch + version 명시
      # (grafana-opensearch-datasource 공식 configure 문서 기준)
      flavor: elasticsearch
      version: "7.10.2"
      database: "wazuh-alerts-*"
      timeField: "@timestamp"
      tlsSkipVerify: true
    basicAuth: true
    basicAuthUser: $WAZUH_INDEXER_USER
    secureJsonData:
      basicAuthPassword: $WAZUH_INDEXER_PASSWORD
    # correlation: Wazuh 이벤트의 호스트(agent.name, FQDN 정규화 전제) → 그 호스트의 Loki 로그.
    # $$ 는 provisioning 환경변수 치환을 피하려는 이스케이프(런타임에 ${__value.raw} 로 복원).
    correlations:
      - targetUID: loki
        label: "보안 이벤트 → 그 호스트 로그"
        description: "Wazuh agent.name(FQDN)로 그 호스트의 Loki 로그를 Explore 분할 뷰로 조회"
        type: query
        config:
          field: agent.name
          target:
            expr: '{host="$${__value.raw}"}'
