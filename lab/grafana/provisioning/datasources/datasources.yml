apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false

  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    jsonData:
      username: $ZBX_GRAFANA_USER
      trends: true
      trendsFrom: "7d"
      # 호스트·아이템 목록 캐시. 기본 1h 는 이 랩에서 두 번 사고를 냈다 —
      # Day7 "메트릭 패널이 멈춘 줄 알았던 표시 지연", 2026-07-31 "호스트 표시명을 바꿨는데
      # 대시보드가 옛 이름을 보고 변수 필터가 안 걸림". 둘 다 설정은 맞는데 화면만 틀린 경우라
      # 원인을 찾는 데 시간이 걸린다. 온보딩·MaC 로 호스트가 자주 바뀌는 랩에서는 짧게 둔다.
      # 실환경(321대)에 그대로 가져가면 Zabbix API 호출이 늘므로 도입 시 재검토 대상.
      cacheTTL: "1m"
    secureJsonData:
      password: $ZBX_GRAFANA_PASSWORD

  - name: Wazuh
    uid: wazuh
    type: grafana-opensearch-datasource
    access: proxy
    url: $WAZUH_INDEXER_URL
    jsonData:
      # Wazuh indexer는 Elasticsearch 7.10.2로 보고 → flavor=elasticsearch + version 명시
      # (grafana-opensearch-datasource 공식 configure 문서 기준)
      flavor: elasticsearch
      version: "7.10.2"
      database: "wazuh-alerts-*"
      timeField: "@timestamp"
      tlsSkipVerify: true
    basicAuth: true
    basicAuthUser: $WAZUH_INDEXER_USER
    secureJsonData:
      basicAuthPassword: $WAZUH_INDEXER_PASSWORD
    # correlation: Wazuh agent.name(FQDN 정규화) → 그 호스트의 Loki 로그(Explore 분할 뷰).
    # Grafana 11.6.16 makeCreateCorrelationCommand 검증 2건에 맞춘 형식(소스 확인):
    #   - root `type` 생략 필수: 명시하면 string→CorrelationType 캐스팅 패닉.
    #   - config.type: query 명시 필수: 생략 시 config.Type="" → ErrInvalidConfigType
    #     ("correlation contains non default value in config.type"). 기본값 query 로 못 떨어뜨림.
    # $$ 는 provisioning 환경변수 치환 회피(런타임에 ${__value.raw} 로 복원).
    correlations:
      - targetUID: loki
        label: "보안 이벤트 → 해당 호스트 로그"
        description: ""
        config:
          type: query
          field: agent.name
          target:
            editorMode: code
            expr: '{host="$${__value.raw}"}'
            queryType: range

  # 취약점 재고 전용(스냅샷 인덱스). 근거는 private/docs/wazuh_enhancement_plan.md §8
  - name: Wazuh-States
    uid: wazuh-states
    type: grafana-opensearch-datasource
    access: proxy
    url: $WAZUH_INDEXER_URL
    jsonData:
      flavor: elasticsearch
      version: "7.10.2"
      database: "wazuh-states-vulnerabilities-*"
      timeField: "vulnerability.detected_at"
      tlsSkipVerify: true
    basicAuth: true
    basicAuthUser: $WAZUH_INDEXER_USER
    secureJsonData:
      basicAuthPassword: $WAZUH_INDEXER_PASSWORD
